[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kjfwd-bot"
version = "0.1.0"
description = "Sender-aware, multimodal WeChat group Agent built on bowxt"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "hzwzwzw"}]
dependencies = []

[project.scripts]
kjfwd-bot = "app:main"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["kjfwd_bot*"]
